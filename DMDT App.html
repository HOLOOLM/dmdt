<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMDT — Booking & Medlemsapp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="landing.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>
  <script type="text/babel" src="admin.jsx"></script>
  <script type="text/babel" src="contract-editor.jsx"></script>
  <script type="text/babel" src="members-honorar.jsx"></script>
  <script type="text/babel" src="member-app.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "inkDeep": "#08111F",
      "ink": "#0F213C",
      "amber": "#E8A867",
      "cream": "#F5EDE0"
    }/*EDITMODE-END*/;

    const App = () => {
      const [mode, setMode] = React.useState("landing"); // landing | admin | login | member
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // Apply tweak colors as CSS vars
      React.useEffect(() => {
        const root = document.documentElement;
        root.style.setProperty('--ink-deep', tweaks.inkDeep);
        root.style.setProperty('--ink', tweaks.ink);
        root.style.setProperty('--amber', tweaks.amber);
        root.style.setProperty('--cream', tweaks.cream);
      }, [tweaks]);

      const handleEnterApp = (target) => {
        if (target === "admin") setMode("admin");
        else setMode("login");
      };

      return (
        <div data-screen-label={"00 " + mode}>
          {/* Persistent mode switcher (top-right floating) */}
          <div className="mode-switcher" data-screen-label="mode-switcher">
            <span className="mono" style={{ fontSize: 10, letterSpacing: '0.16em', color: 'var(--cream-mute)', textTransform: 'uppercase', marginRight: 4 }}>View</span>
            <button className={mode === "landing" ? "active" : ""} onClick={() => setMode("landing")}>Landing</button>
            <button className={mode === "admin" ? "active" : ""} onClick={() => setMode("admin")}>Admin</button>
            <button className={mode === "login" || mode === "member" ? "active" : ""} onClick={() => setMode("login")}>Medlem</button>
          </div>

          {mode === "landing" && <Landing onEnterApp={handleEnterApp} />}
          {mode === "admin" && <AdminShell onExit={() => setMode("landing")} />}
          {(mode === "login" || mode === "member") && <MemberApp onExit={() => setMode("landing")} />}

          <TweaksPanel title="Tweaks">
            <TweakSection label="Brand farver">
              <TweakColor label="Mørkeblå (deep)" value={tweaks.inkDeep} onChange={v => setTweak('inkDeep', v)} />
              <TweakColor label="Mørkeblå (logo)" value={tweaks.ink} onChange={v => setTweak('ink', v)} />
              <TweakColor label="Varm accent" value={tweaks.amber} onChange={v => setTweak('amber', v)} />
              <TweakColor label="Cremehvid" value={tweaks.cream} onChange={v => setTweak('cream', v)} />
            </TweakSection>
            <TweakSection label="Forhåndsindstillinger">
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                <button className="btn btn-ghost btn-sm" onClick={() => setTweak({ amber: '#E8A867', inkDeep: '#08111F', ink: '#0F213C', cream: '#F5EDE0' })}>Backstage (default)</button>
                <button className="btn btn-ghost btn-sm" onClick={() => setTweak({ amber: '#D9A87B', inkDeep: '#0A1929', ink: '#13294B', cream: '#F2EBDD' })}>Late night</button>
                <button className="btn btn-ghost btn-sm" onClick={() => setTweak({ amber: '#F2C68A', inkDeep: '#0C1F36', ink: '#143456', cream: '#FAF4E8' })}>Spotlight</button>
                <button className="btn btn-ghost btn-sm" onClick={() => setTweak({ amber: '#C76B5C', inkDeep: '#0F1A2A', ink: '#13243F', cream: '#F2E8D8' })}>Terracotta</button>
              </div>
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <style>
    .mode-switcher {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(8, 17, 31, 0.85);
      border: 1px solid var(--ink-line);
      border-radius: 999px;
      padding: 4px 6px 4px 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .mode-switcher button {
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--cream-mute);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .mode-switcher button.active {
      background: var(--amber);
      color: var(--ink-deep);
      font-weight: 600;
    }
  </style>
</body>
</html>
